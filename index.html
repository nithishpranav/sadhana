<head>

<style>
:root{
  --ink:#0F141E; --panel:#161D2B; --panel2:#131927; --line:#2A3447;
  --text:#E9E4D8; --dim:#8B93A3; --faint:#5A6375;
  --saffron:#E2A23B; --body:#C97B5D; --mind:#7FA08C; --craft:#6E8CB8; --danger:#C96A5D;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%;background:var(--ink)}
body{margin:0;padding:0;background:var(--ink);color:var(--text);
  height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased}
.serif{font-family:Georgia,"Times New Roman",serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
button{background:none;border:none;color:inherit;font:inherit;padding:0;cursor:pointer;text-align:left}
input,textarea{background:transparent;border:none;color:var(--text);font:inherit;width:100%;outline:none;resize:none;padding:0}
input::placeholder,textarea::placeholder{color:var(--faint)}
header{flex:none;display:flex;justify-content:space-between;align-items:baseline;
  padding:.7rem 1.25rem;padding-top:calc(.7rem + env(safe-area-inset-top));
  border-bottom:1px solid var(--line);background:var(--ink)}
														  
#banner{display:none;background:var(--panel2);border-bottom:1px solid var(--danger);
  padding:.6rem 1.25rem;font-size:.72rem;color:var(--dim);flex:none}
main{flex:1 1 0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:1.5rem max(1.25rem,calc((100% - 42rem)/2)) 3rem}
nav{flex:none;border-top:1px solid var(--line);background:var(--ink);
														  
  padding-bottom:env(safe-area-inset-bottom)}
.navin{max-width:42rem;margin:0 auto;display:flex}
.navbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:.2rem;
  padding:.7rem 0;color:var(--faint);text-align:center}
.navbtn.on{color:var(--saffron)}
.navbtn .g{font-size:1rem;line-height:1}
.label{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.xs{font-size:.68rem}.sm{font-size:.85rem}
.dim{color:var(--dim)}.faint{color:var(--faint)}.saf{color:var(--saffron)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:.8rem 1rem}
.row{display:flex;align-items:flex-start;gap:.7rem}
.between{display:flex;justify-content:space-between;align-items:center}
.flex1{flex:1;min-width:0}
.sp8>*+*{margin-top:.8rem}.sp6>*+*{margin-top:.55rem}.sp4>*+*{margin-top:.35rem}
section{margin-top:2rem}
.cb{width:20px;height:20px;border-radius:3px;border:1.5px solid;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;margin-top:.15rem}
.cb .ck{color:var(--ink);font-weight:700;font-size:.8rem;line-height:1}
.cbs{width:16px;height:16px;border-radius:3px;border:1.5px solid;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;margin-top:.2rem}
.cbs .ck{color:var(--ink);font-weight:700;font-size:.65rem;line-height:1}
.strike{text-decoration:line-through;color:var(--faint)}
.uline{border-bottom:1px solid var(--line);padding-bottom:.3rem}
.x{color:var(--faint);opacity:.5;flex-shrink:0;padding:.1rem .25rem}
.x:active,.x:hover{opacity:1}
.grow{overflow:hidden;line-height:1.55;font-size:.85rem}
.chip{font-family:ui-monospace,Menlo,monospace;font-size:.68rem;padding:.3rem .75rem;
  border-radius:999px;border:1px solid var(--line);color:var(--dim)}
.chip.on{border-color:var(--saffron);color:var(--saffron)}
.dchip{font-family:ui-monospace,Menlo,monospace;font-size:.68rem;width:24px;height:24px;
  border:1px solid var(--line);border-radius:3px;color:var(--faint);
  display:flex;align-items:center;justify-content:center;text-align:center}
.btn{font-family:ui-monospace,Menlo,monospace;font-size:.68rem;background:var(--saffron);
  color:var(--ink);padding:.35rem .8rem;border-radius:4px;font-weight:600}
.quote{font-size:1.5rem;line-height:1.35}
@media(min-width:640px){.quote{font-size:1.75rem}}
.rule{display:flex;align-items:center;gap:.75rem;margin-top:1rem}
.rule .ln{width:36px;height:1px;background:var(--saffron)}
.strip{display:flex;align-items:flex-end;gap:4px}
.sq{width:8px;border-radius:2px}
.bar{height:3px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:.5rem}
.bar>div{height:100%;transition:width .3s}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{flex:1;padding:.55rem 0;text-align:center;font-family:ui-monospace,Menlo,monospace;
  font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.seg button.on{background:var(--panel);color:var(--saffron)}
.ladder{display:flex;gap:.3rem;margin-top:.7rem}
.ladder button{flex:1;padding:.4rem 0;text-align:center;font-family:ui-monospace,Menlo,monospace;
  font-size:.64rem;border:1px solid var(--line);border-radius:3px;color:var(--faint)}
.ladder button.on{border-color:var(--saffron);color:var(--saffron);background:rgba(226,162,59,.12)}
.picklist{border-top:1px solid var(--line);max-height:12rem;overflow-y:auto;margin:.7rem -1rem -0.8rem}
.pickopt{display:flex;gap:.5rem;width:100%;padding:.5rem 1rem;font-size:.85rem;line-height:1.4}
.pickopt:active,.pickopt:hover{background:var(--panel2)}
.pickopt .tag{font-family:ui-monospace,Menlo,monospace;font-size:.64rem;flex-shrink:0;
  width:3.2rem;color:var(--faint);margin-top:.15rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.75rem}
.stat{text-align:center;padding:1rem .5rem}
.stat .v{font-family:ui-monospace,Menlo,monospace;font-size:1.5rem;color:var(--saffron)}
.evpanel{background:var(--panel2);border:1px solid var(--saffron);border-radius:4px;
  padding:.6rem .75rem;margin-top:.7rem}
.dot{width:7px;height:7px;border-radius:99px;display:inline-block}
h2.dh{font-family:Georgia,serif;font-size:1.2rem;font-weight:400;margin:0}
article{margin-top:1rem}
.hr{border-top:1px solid var(--line);margin-top:.6rem;padding-top:.6rem}
.alink{font-family:ui-monospace,Menlo,monospace;font-size:.68rem;color:var(--faint);
  display:flex;align-items:center;gap:.3rem;margin-top:.4rem}
/* ——— edge tabs ——— */
.edge{position:fixed;right:0;z-index:18;width:38px;height:44px;border-radius:9px 0 0 9px;
  display:flex;align-items:center;justify-content:center;font-size:1.05rem;
  border:1px solid;border-right:none;box-shadow:0 2px 10px rgba(0,0,0,.4)}
#edgeCoffee{top:36%;background:#241A14;border-color:#4A3526}
#edgeFood{top:calc(36% + 54px);background:#14201A;border-color:#2E4435}
/* ——— drawer ——— */
#drawer{position:fixed;inset:0;z-index:30;display:none;overflow-y:auto}
#drawer.open{display:block}
.dhead{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:baseline;
  padding:.75rem 1.25rem;padding-top:calc(.75rem + env(safe-area-inset-top));
  border-bottom:1px solid;backdrop-filter:blur(8px)}
.dbody{max-width:42rem;margin:0 auto;width:100%;padding:1.25rem 1.25rem 4rem}
.btn2{font-family:ui-monospace,Menlo,monospace;font-size:.68rem;padding:.35rem .8rem;
  border-radius:4px;font-weight:600;flex-shrink:0}
/* coffee theme — kāpi */
.th-coffee{background:#16100B;color:#EAD9C4}
.th-coffee .dhead{background:rgba(22,16,11,.95);border-color:#3A2B20}
.th-coffee .card{background:#221813;border-color:#3A2B20}
.th-coffee .label{color:#A98B6F}
.th-coffee .uline{border-color:#3A2B20}
.th-coffee input,.th-coffee textarea{color:#EAD9C4}
.th-coffee input::placeholder,.th-coffee textarea::placeholder{color:#6E5743}
.th-coffee .x{color:#6E5743}
.th-coffee .hr{border-color:#3A2B20}
.acc-c{color:#D9A86C}
.btn-c{background:#C08552;color:#16100B}
/* food theme — annam */
.th-food{background:#0D1510;color:#DFE9DA}
.th-food .dhead{background:rgba(13,21,16,.95);border-color:#2E4435}
.th-food .card{background:#16221B;border-color:#2E4435}
.th-food .label{color:#8AA38E}
.th-food .uline{border-color:#2E4435}
.th-food input,.th-food textarea{color:#DFE9DA}
.th-food input::placeholder,.th-food textarea::placeholder{color:#56705C}
.th-food .x{color:#56705C}
.th-food .hr{border-color:#2E4435}
.acc-f{color:#8FBC8F}
.btn-f{background:#7FB069;color:#0D1510}
.over{color:#C97B5D}
.bignum{font-family:ui-monospace,Menlo,monospace;font-size:1.55rem;line-height:1.2}
.wdrop{font-size:1.2rem;opacity:.22;padding:.05rem .1rem;cursor:pointer}
.wdrop.on{opacity:1}
.wbtn{font-family:ui-monospace,Menlo,monospace;font-size:1.1rem;width:32px;height:32px;
  border-radius:99px;border:1px solid;display:flex;align-items:center;justify-content:center;flex-shrink:0}
</style>
</head>
<body>

<header>
  <div style="display:flex;align-items:baseline;gap:.5rem">
    <span class="serif" style="font-size:1.1rem;letter-spacing:.03em">Sādhanā</span>
    <span class="mono xs faint">the practice, kept</span>
  </div>
  <span style="display:flex;gap:.9rem;align-items:baseline">
    <button class="mono xs" id="sync" style="color:var(--faint)">…</button>
    <span class="mono xs faint" id="ind">saved</span>
  </span>
</header>
<div id="banner">This browser is blocking local storage — data will not persist here. Host this file over https (e.g. GitHub Pages) or open it in a different browser.</div>

<main id="main"></main>

<nav><div class="navin" id="nav"></div></nav>
<button class="edge" id="edgeCoffee" title="Kāpi Bar">☕</button>
<button class="edge" id="edgeFood" title="Annam">🍃</button>
<div id="drawer"></div>
<input type="file" id="importFile" accept="application/json" hidden>

<script>
/* ═══════════════ CLOUD SYNC — ONE-TIME SETUP (~10 min) ═══════════════
1. console.firebase.google.com → Add project (any name, Analytics off).
2. Build → Authentication → Get started → Email/Password → Enable → Save.
3. Authentication → Settings → Authorized domains → Add domain →
   your GitHub Pages domain (e.g. yourname.github.io).
4. Build → Firestore Database → Create database → Production mode →
   location: asia-south1 (Mumbai).
5. Firestore → Rules tab → replace everything with the block below → Publish:

   rules_version = '2';
   service cloud.firestore {
     match /databases/{database}/documents {
       match /users/{uid}/{document=**} {
         allow read, write: if request.auth != null
                            && request.auth.uid == uid;
       }
     }
   }

6. Project settings (gear icon) → Your apps → Web app ( </> ) → register →
   copy the firebaseConfig values into FIREBASE_CONFIG just below.
7. Commit + push this file to GitHub Pages. Open the app → Compass →
   Cloud sync → create account once (one email + password), then sign in
   with that same account on every device. Sync is automatic, real-time,
   and offline-tolerant from then on.
═══════════════════════════════════════════════════════════════════════ */
window.FIREBASE_CONFIG = {
  apiKey: "AIzaSyABxKKJIanb1Z9d3Fle-cBlsGOH0KH19xo",
  authDomain: "sadhana-60216.firebaseapp.com",
  projectId: "sadhana-60216",
  storageBucket: "sadhana-60216.firebasestorage.app",
  messagingSenderId: "1083099145524",
  appId: "1:1083099145524:web:e0e87eda2982b162d1f161"
};
(function(){
"use strict";
// ————— constants —————
var LS="sadhana";
var STAGES=["Not started","Studied","Derived myself","Can explain it"];
var DOMAINS=[
  {id:"body",name:"Body",color:"var(--body)",ck:"#C97B5D",hint:"Add a rep — e.g., Push day: bench 4×8"},
  {id:"mind",name:"Mind",color:"var(--mind)",ck:"#7FA08C",hint:"Add a rep — e.g., 10-minute sit"},
  {id:"craft",name:"Craft",color:"var(--craft)",ck:"#6E8CB8",hint:"Add a rep — e.g., derive GBM update by hand"}
];
var TRACKS=[{id:"lc",name:"LeetCode",short:"LC"},{id:"py",name:"Python",short:"Py"},{id:"sql",name:"SQL",short:"SQL"}];
var DIFFS=[{id:"E",c:"var(--mind)"},{id:"M",c:"var(--saffron)"},{id:"H",c:"var(--body)"}];

function uid(){return Math.random().toString(36).slice(2,9)}
function dKey(d){var y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),dd=String(d.getDate()).padStart(2,"0");return y+"-"+m+"-"+dd}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function mondayOf(d){return addDays(d,-((d.getDay()+6)%7))}
function niceDate(d){return d.toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long"})}
function shortDate(k){return new Date(k+"T00:00:00").toLocaleDateString("en-IN",{day:"numeric",month:"short"})}
function jDate(k){return new Date(k+"T00:00:00").toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short",year:"numeric"})}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}

// ————— seed data —————
function seedState(){
  var t=dKey(new Date());
  return {
    settings:{
      quote:"You have a right to your actions alone, never to the fruits of your actions.",
      quoteSource:"Bhagavad Gītā 2.47",
      compass:"By this time next year I am a builder with earned depth — someone who has bled on real systems, not collected prep documents.\n\nMy craft is deep learning for credit risk under regulatory constraint, proven by code I wrote from scratch, math I derived by hand, and predictions I logged and autopsied.\n\nMy body is recomposed through consistent training and 130–140g of protein a day — through sessions done, not plans made.\n\nMy mind is steady: I log daily, review weekly, revise monthly, and never miss twice.\n\nI measure myself by the chain, not the mood.",
      createdAt:t
    },
    entries:{},
    weeks:{},
    mastery:{items:[
      "Derive gradient boosting from first principles (functional gradient descent on the loss)",
      "Derive backpropagation by hand for a 2-layer MLP",
      "Derive logistic regression MLE and the IRLS update",
      "Prove the bias–variance decomposition",
      "Derive scaled dot-product attention — and why the √d scaling exists",
      "Derive FiLM conditioning and what it does to feature geometry",
      "Derive WoE / IV from likelihood ratios",
      "Show on real data why SHAP misbehaves under correlated features"
    ].map(function(t){return{id:uid(),title:t,stage:0,evidence:[]}})},
    roadmap:{domains:[
      {id:"craft",name:"Craft — 90-day deep build",phases:[
        {id:uid(),title:"Phase 1 · Foundations by hand (Wk 1–2)",milestones:[
          "Implement scaled dot-product attention from scratch on toy data",
          "Implement a FiLM layer from scratch; verify conditioning behaviour",
          "Train a tiny model end-to-end; break it deliberately three ways",
          "Start the prediction log — every run gets a written prediction first"
        ].map(ms)},
        {id:uid(),title:"Phase 2 · Freddie Mac pipeline (Wk 3–6)",milestones:[
          "Ingest single-family loan-level data; document every schema decision",
          "Feature engineering with strict temporal splits — no leakage",
          "Baselines: logistic + XGBoost, with predicted-vs-actual AUROC logged"
        ].map(ms)},
        {id:uid(),title:"Phase 3 · Transformer + FiLM (Wk 7–10)",milestones:[
          "Small transformer encoder on loan sequences — written by hand",
          "FiLM conditioning on macro stress scenarios",
          "Ablations: what actually carries the signal?",
          "Autopsy every wrong prediction in the log"
        ].map(ms)},
        {id:uid(),title:"Phase 4 · Ship (Wk 11–13)",milestones:[
          "Draft 'From Snapshot to Scenario' from the experiments — not before them",
          "Clean repo: README, results, reproducible runs",
          "Interview narrative written from the build's real scars"
        ].map(ms)}
      ]},
      {id:"body",name:"Body — 13-week recomposition",phases:[
        {id:uid(),title:"Phase 1 · Base (Wk 1–4)",milestones:[
          "PPL 6×/week — every session logged, none skipped twice",
          "Protein 130–140g daily, planned not improvised",
          "Weekly weigh-in — judge the trend, never the day"
        ].map(ms)},
        {id:uid(),title:"Phase 2 · Progress (Wk 5–9)",milestones:[
          "Progressive overload on the main lifts, logged",
          "Mid-point photos and measurements"
        ].map(ms)},
        {id:uid(),title:"Phase 3 · Consolidate (Wk 10–13)",milestones:[
          "Deload week — recovery is training",
          "Reassess, set the next block"
        ].map(ms)}
      ]},
      {id:"mind",name:"Mind — the keeping of the chain",phases:[
        {id:uid(),title:"The practice itself",milestones:[
          "7 consecutive evening logs",
          "First Sunday review written",
          "First monthly compass revision (monthly — never daily)",
          "30-day chain",
          "90-day chain"
        ].map(ms)}
      ]}
    ]}
  };
  function ms(t){return{id:uid(),text:t,done:false}}
}

// ————— storage —————
var storageOK=true;
try{localStorage.setItem("__t","1");localStorage.removeItem("__t")}catch(e){storageOK=false}
if(!storageOK){document.getElementById("banner").style.display="block"}

function load(){
  if(!storageOK)return null;
  try{var raw=localStorage.getItem(LS);if(raw)return JSON.parse(raw)}catch(e){}
  return null;
}
var S=load()||seedState();
if(!S.settings)S.settings=seedState().settings;
if(!S.entries)S.entries={};
if(!S.weeks)S.weeks={};
if(!S.mastery)S.mastery={items:[]};
if(!S.roadmap)S.roadmap=seedState().roadmap;
if(!S.settings.createdAt)S.settings.createdAt=dKey(new Date());
if(!S.pins)S.pins={body:[{id:uid(),text:"Protein 130–140g"}],mind:[],craft:[]};
["body","mind","craft"].forEach(function(d){if(!S.pins[d])S.pins[d]=[]});

var ind=document.getElementById("ind");
// ————— cloud sync state (engine attaches at bottom) —————
var SYNC={configured:false,user:null,status:"off",lastAt:null};
var syncImpl=null;
function syncPush(store){if(syncImpl&&syncImpl.push)syncImpl.push(store)}
function setSyncStatus(st){
  SYNC.status=st;
  var el=document.getElementById("sync");if(!el)return;
  var m={off:["local only","var(--faint)"],signedout:["sign in to sync","var(--saffron)"],
    syncing:["⟳ syncing","var(--dim)"],synced:["✓ cloud","var(--mind)"],
    offline:["offline","var(--dim)"],error:["sync error","var(--danger)"],
    sdkfail:["sync unavailable","var(--danger)"]};
  var v=m[st]||m.off;el.textContent=v[0];el.style.color=v[1];
}
var saveTimer=null;
function save(){
  ind.textContent="saving…";ind.style.color="var(--dim)";
  S._updatedAt=new Date().toISOString();
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){
    try{localStorage.setItem(LS,JSON.stringify(S));ind.textContent="saved";ind.style.color="var(--faint)"}
    catch(e){ind.textContent="save failed";ind.style.color="var(--danger)"}
    syncPush("ledger");
  },400);
}

// ————— ui state (transient) —————
var UI={tab:"today",compassOpen:false,pickerFor:null,goalsSub:"mastery",pending:null,evOpen:{},pTrack:"lc",pDiff:"M",drawer:null};

// ————— kāpi & annam — separate stores —————
var LSC="sadhana-coffee", LSF="sadhana-food";
function loadAux(k,fb){
  if(!storageOK)return fb;
  try{var r=localStorage.getItem(k);if(r){var p=JSON.parse(r);if(p)return p}}catch(e){}
  return fb;
}
var CF=loadAux(LSC,{brews:[]});
if(!CF.brews)CF.brews=[];
var FD=loadAux(LSF,{target:2000,days:{}});
if(!FD.days)FD.days={};
if(typeof FD.target!=="number")FD.target=2000;

var auxTimers={};
function saveAux(k,obj){
  obj._updatedAt=new Date().toISOString();
  var di=document.getElementById("dind");
  if(di){di.textContent="saving…"}
  clearTimeout(auxTimers[k]);
  auxTimers[k]=setTimeout(function(){
    var d2=document.getElementById("dind");
    try{localStorage.setItem(k,JSON.stringify(obj));if(d2)d2.textContent="saved"}
    catch(e){if(d2)d2.textContent="save failed"}
    syncPush(k===LSC?"coffee":"food");
  },400);
}
function fdDay(k){if(!FD.days[k])FD.days[k]={items:[],water:0};var d=FD.days[k];if(!d.items)d.items=[];if(typeof d.water!=="number")d.water=0;return d}

// ————— entry helpers —————
function emptyEntry(){return{reps:{body:[],mind:[],craft:[]},log:{did:"",prediction:"",reflection:""},problems:[],weekly:""}}
function freshToday(){
  var e=emptyEntry();
  ["body","mind","craft"].forEach(function(d){
    (S.pins&&S.pins[d]?S.pins[d]:[]).forEach(function(p){
      e.reps[d].push({id:uid(),text:p.text,done:false,ref:null,pinId:p.id});
    });
  });
  return e;
}
function normReps(e){
  ["body","mind","craft"].forEach(function(d){
    var r=e.reps?e.reps[d]:null;
    if(Array.isArray(r)){
      e.reps[d]=r.map(function(it){return Object.assign({id:uid(),text:"",done:false,ref:null,pinId:null},it)});
    }else if(r&&typeof r==="object"&&((r.text&&r.text.trim())||r.done)){
      e.reps[d]=[{id:uid(),text:r.text||"",done:!!r.done,ref:r.ref||null,pinId:null}];
    }else{
      e.reps[d]=[];
    }
  });
}
function getEntry(k){
  var e=S.entries[k];if(!e)return null;
  if(!e.reps)e.reps={body:[],mind:[],craft:[]};
  normReps(e);
																												 
  e.log=Object.assign({did:"",prediction:"",reflection:""},e.log||{});
  e.problems=e.problems||[];
  return e;
}
function ensureToday(){var k=dKey(new Date());if(!S.entries[k])S.entries[k]=freshToday();return getEntry(k)}
function entryCounts(e){
  if(!e)return false;
  var rep=e.reps&&Object.keys(e.reps).some(function(d){
    var arr=e.reps[d];
    if(Array.isArray(arr))return arr.some(function(r){return r.done});
    return arr&&arr.done;
  });
  var log=e.log&&((e.log.did||"").trim()||(e.log.reflection||"").trim());
  var pr=e.problems&&e.problems.length>0;
  return !!(rep||log||pr);
}
function chainCalc(){
  var today=new Date(),tk=dKey(today),strip=[],i,k;
  for(i=13;i>=0;i--){k=dKey(addDays(today,-i));strip.push({key:k,kept:entryCounts(getEntry(k)),isToday:i===0})}
  var current=0,start=entryCounts(getEntry(tk))?0:1;
  for(i=start;i<3650;i++){if(entryCounts(getEntry(dKey(addDays(today,-i)))))current++;else break}
  var longest=0,run=0,prev=null,keys=Object.keys(S.entries).sort();
  keys.forEach(function(k){
    if(!entryCounts(getEntry(k))){run=0;prev=null;return}
    if(prev){var diff=(new Date(k)-new Date(prev))/864e5;run=diff===1?run+1:1}else run=1;
    prev=k;if(run>longest)longest=run;
  });
  var ym=!entryCounts(getEntry(dKey(addDays(today,-1))))&&keys.length>0;
  return{strip:strip,current:current,longest:longest,yesterdayMissed:ym};
}

function dayReport(k){
  var e=getEntry(k)||freshToday();
  var ch=chainCalc();
  var date=new Date(k+"T00:00:00");
  var L=[];
  L.push("# Sādhanā — "+k+" ("+date.toLocaleDateString("en-IN",{weekday:"long"})+")");
  L.push("Chain: "+ch.current+" day"+(ch.current===1?"":"s"));
  L.push("");
  L.push("## Reps");
  DOMAINS.forEach(function(d){
    var arr=e.reps[d.id]||[];
    var dn=arr.filter(function(r){return r.done}).length;
    L.push("### "+d.name+" ("+dn+"/"+arr.length+")");
    if(arr.length)arr.forEach(function(r){L.push("- ["+(r.done?"x":" ")+"] "+r.text)});
    else L.push("- (none)");
  });
  L.push("");
  L.push("## Problems solved ("+(e.problems||[]).length+")");
  if((e.problems||[]).length)e.problems.forEach(function(p){
    var tr=TRACKS.find(function(t){return t.id===p.track});
    L.push("- "+(tr?tr.name:p.track)+" · "+p.difficulty+" · "+p.name+(p.topic?" ("+p.topic+")":""));
  });
  else L.push("- (none)");
  L.push("");
  L.push("## Evening log");
  L.push("- Did: "+(e.log.did||"—"));
  L.push("- Predicted vs happened: "+(e.log.prediction||"—"));
  L.push("- Reflection: "+(e.log.reflection||"—"));
  var s=fdSums(k),fdd=FD.days[k];
  L.push("");
  L.push("## Annam — food & water");
  L.push("Target "+FD.target+" kcal · consumed "+s.consumed+" · remaining "+(FD.target-s.consumed)+" · water "+s.water+" glass"+(s.water===1?"":"es"));
  if(fdd&&fdd.items&&fdd.items.length)fdd.items.forEach(function(i){L.push("- "+i.name+" — "+(+i.cal||0)+" kcal")});
  var brews=CF.brews.filter(function(b){return b.date===k});
  if(brews.length){
    L.push("");
    L.push("## Kāpi — brews");
    brews.forEach(function(b){
      var meta=[b.type,b.grind,b.temp,b.equip,b.time].filter(function(x){return x&&x.trim()}).join(", ");
      L.push("- "+(b.stamp?b.stamp+" · ":"")+(b.brand||"—")+(meta?" ("+meta+")":"")+(b.comm?" — "+b.comm:""));
    });
  }
  return L.join("\n");
}
function weekReport(){
  var today=new Date(),mon=mondayOf(today),wk=dKey(mon),tk=dKey(today);
  var days=[],kept=0,i;
  for(i=0;i<7;i++){var k=dKey(addDays(mon,i));days.push(k);if(entryCounts(getEntry(k)))kept++}
  var L=[];
  L.push("# Sādhanā — week of "+wk);
  L.push("Days kept: "+kept+"/7");
  L.push("");
  days.forEach(function(k){
    if(k>tk)return;
    var hasFood=FD.days[k]&&((FD.days[k].items||[]).length||FD.days[k].water);
    var hasBrew=CF.brews.some(function(b){return b.date===k});
    if(!S.entries[k]&&!hasFood&&!hasBrew){
      L.push("## "+k+" — no entry");L.push("");return;
    }
    L.push(dayReport(k).replace(/^## /gm,"### ").replace(/^# /,"## "));
    L.push("");
  });
  var repC={body:0,mind:0,craft:0},probC={lc:0,py:0,sql:0};
  days.forEach(function(k){
    var e=getEntry(k);if(!e)return;
    Object.keys(e.reps).forEach(function(d){
      var a=e.reps[d];
      if(Array.isArray(a)&&repC[d]!==undefined)repC[d]+=a.filter(function(r){return r.done}).length;
    });
    (e.problems||[]).forEach(function(p){if(probC[p.track]!==undefined)probC[p.track]++});
  });
  L.push("## Week totals");
  L.push("- Reps done: Body "+repC.body+", Mind "+repC.mind+", Craft "+repC.craft);
  L.push("- Problems: LeetCode "+probC.lc+", Python "+probC.py+", SQL "+probC.sql);
  var adv=[];
  S.mastery.items.forEach(function(m){(m.evidence||[]).forEach(function(ev){
    if(ev.date>=wk&&ev.date<=days[6])adv.push("- "+ev.date+": "+m.title+" → "+STAGES[ev.stage]+(ev.note?" — "+ev.note:""));
  })});
  if(adv.length){L.push("");L.push("## Intuition earned this week");adv.forEach(function(a){L.push(a)})}
  L.push("");
  L.push("## Review — what compounded, what leaked");
  L.push((S.weeks[wk]&&S.weeks[wk].review)||"—");
  return L.join("\n");
}

function doExport(){

function exportBlob(data,fname,mime){
  var blob=new Blob([typeof data==="string"?data:JSON.stringify(data,null,2)],{type:mime||"application/json"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url;a.download=fname;a.click();
  URL.revokeObjectURL(url);
}
document.getElementById("importFile").addEventListener("change",function(e){
  var f=e.target.files[0];if(!f)return;
  var reader=new FileReader();
  reader.onload=function(){
    try{
      var data=JSON.parse(reader.result);
      if(!data||!data.settings){alert("Not a Sādhanā export file.");return}
      if(!confirm("Replace ALL current data on this device with the imported file?"))return;
      S={
        settings:Object.assign(seedState().settings,data.settings),
        entries:data.entries||{},
        weeks:data.weeks||{},
        mastery:data.mastery||{items:[]},
        roadmap:data.roadmap||seedState().roadmap
      };
      if(data.coffee&&data.coffee.brews){CF=data.coffee;try{localStorage.setItem(LSC,JSON.stringify(CF))}catch(err){}}
      if(data.food&&data.food.days){FD=Object.assign({target:2000,days:{}},data.food);try{localStorage.setItem(LSF,JSON.stringify(FD))}catch(err){}}
      try{localStorage.setItem(LS,JSON.stringify(S))}catch(err){}
      var nowIso=new Date().toISOString();
      S._updatedAt=nowIso;CF._updatedAt=nowIso;FD._updatedAt=nowIso;
      syncPush("ledger");syncPush("coffee");syncPush("food");
      UI.drawer=null;renderDrawer();
      render();
      alert("Imported. The ledger continues.");
    }catch(err){alert("Could not read that file.")}
  };
  reader.readAsText(f);
  e.target.value="";
});

  var h='<div class="dhead"><div style="display:flex;align-items:baseline;gap:.5rem">'
    +'<span class="serif" style="font-size:1.1rem">Kāpi Bar</span>'
    +'<span class="mono xs" style="color:#A98B6F">the daily cup, kept</span></div>'
    +'<div style="display:flex;align-items:baseline;gap:1rem">'
    +'<span class="mono xs" id="dind" style="color:#6E5743">saved</span>'
    +'<button class="mono" data-dact="close" style="color:#D9A86C">✕</button></div></div>'
    +'<div class="dbody">';
  // brew form
  h+='<div class="card sp8">'
    +'<div class="label">Log a brew</div>'
    +'<input id="cf_brand" class="sm uline" placeholder="Brand — e.g., Blue Tokai, Attikan Estate">'
    +'<div class="grid2">'
    +'<input id="cf_type" class="sm uline" placeholder="Type / roast — washed, medium">'
    +'<input id="cf_grind" class="sm uline" placeholder="Grind — 18 clicks, med-fine">'
    +'</div><div class="grid2">'
    +'<input id="cf_temp" class="sm uline" placeholder="Temp — 93°C">'
    +'<input id="cf_equip" class="sm uline" placeholder="Equipment — Aeropress, V60">'
    +'</div>'
    +'<input id="cf_time" class="sm uline" placeholder="Brew time — 30s bloom, 2:30 total">'
    +'<textarea id="cf_comm" class="grow uline" rows="2" placeholder="Commentary — body, acidity, what to change next time"></textarea>'
    +'<div style="display:flex;justify-content:flex-end"><button class="btn2 btn-c" data-dact="cf-add">+ log brew</button></div>'
    +'</div>';
  // brew list
  var brews=CF.brews.slice().reverse();
  h+='<section><div class="between"><div class="label">The record — '+CF.brews.length+' brew'+(CF.brews.length===1?'':'s')+'</div>'
    +'<button class="mono xs" data-dact="cf-export" style="color:#A98B6F">↓ export</button></div>';
  if(brews.length===0){
    h+='<div class="card" style="margin-top:.8rem;text-align:center;padding:1.6rem 1rem">'
      +'<p class="serif" style="margin:0;color:#A98B6F;font-size:1.05rem">No cups in the ledger yet.</p>'
      +'<p class="mono xs" style="margin:.4rem 0 0;color:#6E5743">The first one always tastes like beginning.</p></div>';
  }else{
    h+='<div class="sp8" style="margin-top:.8rem">';
    brews.forEach(function(b){
      var meta=[b.type,b.grind,b.temp,b.equip,b.time].filter(function(x){return x&&x.trim()}).join(" · ");
      h+='<div class="card"><div class="between">'
        +'<span class="label" style="color:#6E5743">'+shortDate(b.date)+(b.stamp?' · '+esc(b.stamp):'')+'</span>'
        +'<button class="x" data-dact="cf-del" data-id="'+b.id+'">✕</button></div>'
        +'<div class="serif" style="font-size:1.05rem;margin-top:.2rem">'+esc(b.brand||"—")+'</div>'
        +(meta?'<div class="mono xs" style="color:#A98B6F;margin-top:.3rem;line-height:1.6">'+esc(meta)+'</div>':'')
        +(b.comm?'<p class="serif sm" style="margin:.45rem 0 0;line-height:1.55;color:#CDB89E;font-style:italic">'+esc(b.comm)+'</p>':'')
        +'</div>';
    });
    h+='</div>';
  }
  h+='</section></div>';
  return h;
}

function fdSums(k){
  var d=FD.days[k];
  var c=0;if(d&&d.items)d.items.forEach(function(i){c+=(+i.cal||0)});
  return{consumed:c,water:d?(d.water||0):0};
}

function renderFood(){
  var tk=dKey(new Date());
  var d=fdDay(tk);
  var s=fdSums(tk);
  var rem=FD.target-s.consumed;
  var pct=FD.target>0?Math.min(100,Math.round(s.consumed/FD.target*100)):0;
  var over=rem<0;
  var h='<div class="dhead"><div style="display:flex;align-items:baseline;gap:.5rem">'
    +'<span class="serif" style="font-size:1.1rem">Annam</span>'
    +'<span class="mono xs" style="color:#8AA38E">what feeds the work</span></div>'
    +'<div style="display:flex;align-items:baseline;gap:1rem">'
    +'<span class="mono xs" id="dind" style="color:#56705C">saved</span>'
    +'<button class="mono" data-dact="close" style="color:#8FBC8F">✕</button></div></div>'
    +'<div class="dbody">';
  // summary
  h+='<div class="grid3">'
    +'<div class="card stat"><div class="bignum acc-f" id="fd_cons">'+s.consumed+'</div><div class="mono xs" style="color:#56705C;margin-top:.25rem">consumed</div></div>'
    +'<div class="card stat"><input class="bignum" data-dbind="fd-target" type="number" inputmode="numeric" value="'+FD.target+'" style="text-align:center;color:#DFE9DA"><div class="mono xs" style="color:#56705C;margin-top:.25rem">target — tap to edit</div></div>'
    +'<div class="card stat"><div class="bignum '+(over?'over':'acc-f')+'" id="fd_rem">'+rem+'</div><div class="mono xs" style="color:#56705C;margin-top:.25rem">remaining</div></div>'
    +'</div>'
    +'<div class="bar" style="background:#2E4435;margin-top:.75rem"><div id="fd_bar" style="width:'+pct+'%;background:'+(over?'#C97B5D':'#7FB069')+'"></div></div>';
  // add food
  h+='<div class="card sp8" style="margin-top:1.25rem">'
    +'<div class="label">Add food / drink</div>'
    +'<div style="display:flex;align-items:center;gap:.6rem">'
    +'<input id="fd_name" class="sm uline" placeholder="What — e.g., curd rice, whey shake" style="flex:2">'
    +'<input id="fd_cal" class="sm uline" type="number" inputmode="numeric" placeholder="kcal" style="flex:.7;min-width:4rem">'
    +'<button class="btn2 btn-f" data-dact="fd-add">+ add</button></div>';
  if(d.items.length>0){
    h+='<div class="sp4" style="padding-top:.2rem">';
    d.items.forEach(function(i){
      h+='<div style="display:flex;align-items:center;gap:.6rem">'
        +'<span class="sm" style="flex:1">'+esc(i.name)+'</span>'
        +'<span class="mono xs" style="color:#8AA38E">'+(+i.cal||0)+' kcal</span>'
        +'<button class="x" data-dact="fd-del" data-id="'+i.id+'">✕</button></div>';
    });
    h+='</div>';
  }
  h+='</div>';
  // water
  var w=d.water,drops='';
  for(var i=0;i<Math.max(8,w);i++){drops+='<span class="wdrop'+(i<w?' on':'')+'" data-dact="fd-wset" data-n="'+(i+1)+'">💧</span>'}
  h+='<div class="card" style="margin-top:.75rem"><div class="between"><div class="label">Water</div>'
    +'<span class="mono xs" style="color:#8AA38E">'+w+' glass'+(w===1?'':'es')+'</span></div>'
    +'<div style="display:flex;align-items:center;gap:.6rem;margin-top:.55rem">'
    +'<button class="wbtn" data-dact="fd-wminus" style="border-color:#2E4435;color:#8AA38E">−</button>'
    +'<div style="flex:1;line-height:1.9">'+drops+'</div>'
    +'<button class="wbtn" data-dact="fd-wplus" style="border-color:#7FB069;color:#8FBC8F">+</button>'
    +'</div></div>';
  // last 7 days
  h+='<section><div class="between"><div class="label">Last 7 days</div>'
    +'<button class="mono xs" data-dact="fd-export" style="color:#8AA38E">↓ export</button></div>'
    +'<div class="card sp4" style="margin-top:.8rem">';
  for(var j=0;j<7;j++){
    var k=dKey(addDays(new Date(),-j));
    var ss=fdSums(k);
    var has=FD.days[k]&&((FD.days[k].items||[]).length||FD.days[k].water);
    h+='<div class="between">'
      +'<span class="mono xs" style="color:#56705C">'+(j===0?'today':shortDate(k))+'</span>'
      +'<span class="mono xs" style="color:'+(has?(ss.consumed>FD.target?'#C97B5D':'#8FBC8F'):'#3E5246')+'">'
      +(has?ss.consumed+' / '+FD.target+' kcal · '+ss.water+'💧':'—')
      +'</span></div>';
  }
  h+='</div></section></div>';
  return h;
}

function updateFoodSummary(){
  var tk=dKey(new Date()),s=fdSums(tk),rem=FD.target-s.consumed;
  var pct=FD.target>0?Math.min(100,Math.round(s.consumed/FD.target*100)):0;
  var over=rem<0;
  var er=document.getElementById("fd_rem"),eb=document.getElementById("fd_bar"),ec=document.getElementById("fd_cons");
  if(ec)ec.textContent=s.consumed;
  if(er){er.textContent=rem;er.className="bignum "+(over?"over":"acc-f")}
  if(eb){eb.style.width=pct+"%";eb.style.background=over?"#C97B5D":"#7FB069"}
}

document.getElementById("edgeCoffee").addEventListener("click",function(){UI.drawer="coffee";renderDrawer()});
document.getElementById("edgeFood").addEventListener("click",function(){UI.drawer="food";renderDrawer()});

drawer.addEventListener("click",function(e){
  var b=e.target.closest("[data-dact]");if(!b)return;
  var a=b.dataset.dact,ds=b.dataset;
  if(a==="close"){UI.drawer=null;renderDrawer()}
  else if(a==="cf-add"){
    var g=function(id){var el=document.getElementById(id);return el?el.value.trim():""};
    var brand=g("cf_brand");
    if(!brand&&!g("cf_type")&&!g("cf_equip"))return;
    var now=new Date();
    CF.brews.push({id:uid(),date:dKey(now),stamp:now.toTimeString().slice(0,5),
      brand:brand,type:g("cf_type"),grind:g("cf_grind"),temp:g("cf_temp"),
      equip:g("cf_equip"),time:g("cf_time"),comm:g("cf_comm")});
    saveAux(LSC,CF);renderDrawer();
  }
  else if(a==="cf-del"){
    if(confirm("Delete this brew from the record?")){
      CF.brews=CF.brews.filter(function(x){return x.id!==ds.id});
      saveAux(LSC,CF);renderDrawer();
    }
  }
  else if(a==="cf-export"){exportBlob(Object.assign({},CF,{exportedAt:new Date().toISOString()}),"kapi-"+dKey(new Date())+".json")}
  else if(a==="fd-add"){
    var n=document.getElementById("fd_name"),c=document.getElementById("fd_cal");
    if(!n||!n.value.trim())return;
    fdDay(dKey(new Date())).items.push({id:uid(),name:n.value.trim(),cal:parseInt(c&&c.value?c.value:"0",10)||0});
    saveAux(LSF,FD);renderDrawer();
    var n2=document.getElementById("fd_name");if(n2)n2.focus();
  }
  else if(a==="fd-del"){
    var dd=fdDay(dKey(new Date()));
    dd.items=dd.items.filter(function(x){return x.id!==ds.id});
    saveAux(LSF,FD);renderDrawer();
  }
  else if(a==="fd-wplus"){fdDay(dKey(new Date())).water++;saveAux(LSF,FD);renderDrawer()}
  else if(a==="fd-wminus"){var dw=fdDay(dKey(new Date()));dw.water=Math.max(0,dw.water-1);saveAux(LSF,FD);renderDrawer()}
  else if(a==="fd-wset"){
    var dn=parseInt(ds.n,10),dv=fdDay(dKey(new Date()));
    dv.water=(dv.water===dn)?dn-1:dn;
    saveAux(LSF,FD);renderDrawer();
  }
  else if(a==="fd-export"){exportBlob(Object.assign({},FD,{exportedAt:new Date().toISOString()}),"annam-"+dKey(new Date())+".json")}
});

drawer.addEventListener("input",function(e){
  var t=e.target;
  if(t.classList&&t.classList.contains("grow"))fit(t);
  if(t.dataset.dbind==="fd-target"){
    var v=parseInt(t.value,10);
    FD.target=isNaN(v)||v<0?0:v;
    saveAux(LSF,FD);
    updateFoodSummary();
  }
});

drawer.addEventListener("keydown",function(e){
  if(e.key==="Escape"){UI.drawer=null;renderDrawer();return}
  if(e.key!=="Enter")return;
  var t=e.target;
  if(t.id==="fd_name"||t.id==="fd_cal"){e.preventDefault();var ab=drawer.querySelector('[data-dact="fd-add"]');if(ab)ab.click()}
});

render();
setSyncStatus("off");

// ————— cloud sync engine (firebase, loaded dynamically so the app never depends on it) —————
document.getElementById("sync").addEventListener("click",function(){
  if(SYNC.status==="signedout"||SYNC.status==="off"){UI.tab="compass";UI.pickerFor=null;UI.pending=null;render()}
});

(function initSync(){
  var cfg=window.FIREBASE_CONFIG;
  if(!cfg||!cfg.apiKey||String(cfg.apiKey).indexOf("PASTE")===0){setSyncStatus("off");return}
  SYNC.configured=true;
  setSyncStatus(navigator.onLine===false?"offline":"syncing");
  var V="12.14.0";
  Promise.all([
    import("https://www.gstatic.com/firebasejs/"+V+"/firebase-app.js"),
    import("https://www.gstatic.com/firebasejs/"+V+"/firebase-auth.js"),
    import("https://www.gstatic.com/firebasejs/"+V+"/firebase-firestore.js")
  ]).then(function(mods){
    var appM=mods[0],authM=mods[1],fsM=mods[2];
    var fbApp=appM.initializeApp(cfg);
    var auth=authM.getAuth(fbApp);
    var db;
    try{db=fsM.initializeFirestore(fbApp,{localCache:fsM.persistentLocalCache({tabManager:fsM.persistentSingleTabManager()})})}
    catch(e){try{db=fsM.getFirestore(fbApp)}catch(e2){setSyncStatus("sdkfail");return}}

    var stores={
      ledger:{get:function(){return S},set:function(v){S=v;try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}},
      coffee:{get:function(){return CF},set:function(v){CF=v;try{localStorage.setItem(LSC,JSON.stringify(CF))}catch(e){}}},
      food:{get:function(){return FD},set:function(v){FD=v;try{localStorage.setItem(LSF,JSON.stringify(FD))}catch(e){}}}
    };
    var names=["ledger","coffee","food"];
    var ref=function(uid,st){return fsM.doc(db,"users",uid,"stores",st)};
    var pushTimers={},unsubs=[];

    function push(st){
      if(!SYNC.user)return;
      clearTimeout(pushTimers[st]);
      setSyncStatus("syncing");
      pushTimers[st]=setTimeout(function(){
        var obj=stores[st].get();
        fsM.setDoc(ref(SYNC.user.uid,st),{json:JSON.stringify(obj),updatedAt:obj._updatedAt||new Date().toISOString()})
          .then(function(){SYNC.lastAt=new Date();setSyncStatus("synced")})
          .catch(function(){setSyncStatus(navigator.onLine===false?"offline":"error")});
        if(navigator.onLine===false)setSyncStatus("offline");
      },1800);
    }

    function applyRemote(st,obj){
      var ae=document.activeElement;
      if(ae&&(ae.tagName==="TEXTAREA"||ae.tagName==="INPUT")){setTimeout(function(){applyRemote(st,obj)},4000);return}
      stores[st].set(obj);
      render();if(UI.drawer)renderDrawer();
    }

    function listen(uid){
      names.forEach(function(st){
        var first=true;
        unsubs.push(fsM.onSnapshot(ref(uid,st),function(snap){
          if(snap.metadata.hasPendingWrites){first=false;return}
          var localObj=stores[st].get();
          var localAt=localObj._updatedAt||"";
          if(!snap.exists()){
            if(first)push(st);
            first=false;return;
          }
          var data=snap.data()||{};
          var remoteAt=data.updatedAt||"";
          if(remoteAt>localAt&&data.json){
            try{
              var obj=JSON.parse(data.json);
              obj._updatedAt=remoteAt;
              applyRemote(st,obj);
              SYNC.lastAt=new Date();setSyncStatus("synced");
            }catch(e){}
          }else if(first&&localAt>remoteAt){push(st)}
          else if(first){setSyncStatus("synced")}
          first=false;
        },function(){setSyncStatus(navigator.onLine===false?"offline":"error")}));
      });
    }

    authM.onAuthStateChanged(auth,function(u){
      unsubs.forEach(function(f){try{f()}catch(e){}});unsubs=[];
      SYNC.user=u?{uid:u.uid,email:u.email}:null;
      if(u){setSyncStatus("syncing");listen(u.uid)}
      else setSyncStatus("signedout");
      if(UI.tab==="compass")render();
    });

    window.addEventListener("online",function(){if(SYNC.user){setSyncStatus("syncing");names.forEach(push)}});
    window.addEventListener("offline",function(){if(SYNC.configured)setSyncStatus("offline")});

    syncImpl={
      push:push,
      signIn:function(em,pw){return authM.signInWithEmailAndPassword(auth,em,pw)},
      signUp:function(em,pw){return authM.createUserWithEmailAndPassword(auth,em,pw)},
      signOut:function(){return authM.signOut(auth)}
    };
  }).catch(function(){setSyncStatus("sdkfail")});
})();
})();
</script>
